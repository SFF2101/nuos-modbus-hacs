pilot_diagnostic:
  # The only register read on the installed appliance. Exposed by the integration
  # as an enabled, raw, unit-less diagnostic. Never relabelled as temperature.
  key: raw_holding_8
  read: {fc: 3, address: 8, count: 1}
  observed: {raw: 12, polls: ">=3", date: "2026-10-20", via: "HA YAML modbus hub nuos_g13 (DAI-OUT-623)"}
  candidate_meanings:
    - {meaning: "009.Start_HP_Hour = 12 h", plausibility: "consistent (0–23)", requires: "§10.4 applies to VTC200 and parameters are holding registers"}
    - {meaning: "T2 = 1.2 °C", plausibility: "implausible for a heated tank", requires: "§10.5 datapoints are holding registers"}
  ha: {platform: sensor, enabled_default: true, entity_category: diagnostic, name: "Holding register 8 raw (unverified)"}
