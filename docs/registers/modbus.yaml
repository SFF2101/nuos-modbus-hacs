protocol:
  source: {doc: nuos_ii_2026_09, page: 35, section: "10.5 Modbus Protokoll"}
  mode: "RTU RS485"
  start_bits: 1
  data_bits: 8
  stop_bits: "1 with even/odd parity, 2 with no parity"
  function_codes_supported: [3, 4, 6, 17]   # 'Hilfsfunktion 3,4,6,17'
  function_code_meaning:
    3: "Read Holding Registers"
    4: "Read Input Registers"
    6: "Write Single Register"
    17: "Report Server (Slave) ID"
  function_code_per_table: unknown   # the manual does NOT state which table uses FC03 vs FC04
  termination: "120 Ω between A and B at first and last device (total 60 Ω)"
  warning: "Other Modbus parameters may be visible; they must not be changed (warranty exclusion)."

address_convention:
  manual_column: "Modbus Adresse"
  observed_pattern: "For §10.4, Modbus Adresse = display number − 1 (e.g. 005.T_soll → 4)."
  assumed_ha_mapping: "manual address = Modbus PDU address (0-based), i.e. Home Assistant 'address' value"
  status: unverified
  evidence:
    - "HA YAML hub nuos_g13: FC03, address 8 → raw 12 repeatedly (2026-10-20, DAI-OUT-623); same raw value as the October QModMaster commissioning read at 'address 8'."
    - "Same raw value in both tools is consistent with both using the PDU address, but does not prove it."

register_space_inference:
  status: inference_not_validated
  reasoning:
    - "The §10.4 parameter table and the §10.5 datapoint table claim overlapping addresses with different meanings (e.g. 8 = 009.Start_HP_Hour and 8 = T2). They therefore cannot share one register space."
    - "Only FC03 and FC04 are listed for reading, and FC06 (write single holding register) is listed; §10.4 parameters carry write semantics (118.Modbus Allow Write)."
    - "Hence: §10.4 parameters are most probably HOLDING registers (FC03 read, FC06 write) and §10.5 datapoints most probably INPUT registers (FC04)."
    - "Under this inference the live FC03 address 8 raw 12 would be 009.Start_HP_Hour = 12 (valid range 0–23), not tank temperature. Under the opposite assignment it would be T2 = 1.2 °C, which is implausible for a heated tank."
  how_to_validate: "Owner reads display 'Start HP hour' (timer start hour) and T2/'T Wasser' at a recorded time; then a separately approved single FC04 read of input address 8. See docs/VALIDATION.md."

validation_states:
  not_validated: "Documented by a source; never read on the installed appliance."
  read_ok_semantics_unvalidated: "A read succeeded on the installed appliance; meaning/scale not confirmed."
  validated: "Value confirmed against an independent reference on the installed appliance."

summary:
  documented_addresses_total: 56
  documented_table_rows_total: 57          # 016.WP_LS has an AC and an EC row on the same address
  by_table:
    "10.4 parameters (005–034)": 29        # addresses 4–23 and 25–33; 24 (display 025) is not documented
    "10.4 RTC (104–110)": 7
    "10.4 communication (115–118)": 4
    "10.5 ES1076 datapoints": 16
  validated_semantics_on_installed_appliance: 0
  read_ok_semantics_unvalidated_on_installed_appliance: 1   # FC03 address 8 (raw 12)
  undocumented_gaps: "addresses 0–3 and 24 in the parameter space; 34–102, 110–113, 118+ undocumented. Datapoint addresses 2–6 and 20–118 undocumented. Not to be scanned."

# ---------------------------------------------------------------------------
# Field legend per register (see README for full definitions)
#   key            stable identifier used by the integration
#   display        manual display id / label
#   address        manual 'Modbus Adresse'
#   space          candidate register space (holding|input) — inference, see above
#   fc_read        candidate read function code
#   fc_write       documented write function code (null = not writable per source)
#   type           wire type (16-bit register); signedness never stated by source
#   decimals       manual 'Dezimal' column (value = raw / 10^decimals)
#   offset         manual 'Offset' column
#   unit, min, max as printed
#   enum           value → label as printed (German labels kept, English added)
#   sentinel       null/sentinel handling (none documented anywhere)
#   ha             proposed Home Assistant entity
#   validation     on-site validation state
#   anomalies      source inconsistencies, reproduced not corrected
# ---------------------------------------------------------------------------

defaults:
