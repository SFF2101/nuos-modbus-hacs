# Domotec NUOS — Modbus register catalogue (development provenance)
#
# THIS FILE IS NOT HOME ASSISTANT CONFIGURATION. Do not paste it into
# configuration.yaml. It is the version-controlled, source-cited record of every
# register the manufacturer documents, plus what has (and has not) been
# validated on the installed appliance. The integration's runtime table
# (custom_components/nuos_modbus/registers.py) is cross-checked against this
# file by tests/test_catalogue.py.
#
# Conventions: see docs/registers/README.md.

