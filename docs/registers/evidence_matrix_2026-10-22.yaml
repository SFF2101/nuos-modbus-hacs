schema_version: 1
title: NUOS VTC200 evidence matrix
generated: '2026-10-22'
dai: DAI-IN-636
baseline_commit: 85e6c1ad1a4a17c69fd08f6bcbb652337b5898fa
evidence_window: 2026-10-20T20:42+02:00 .. 2026-10-22T12:59+02:00 (HA recorder, read-only)
legend:
  PROVEN: behaviour or value agrees with an independent reference (power meter, gateway config, real time) on the installed
    unit
  PLAUSIBLE: consistent with the manufacturer table and live behaviour; no independent reference
  UNKNOWN: no usable evidence
method: Live HA states/history of the 57 nuos_modbus entities and the NUOS smart-plug power sensor; no new Modbus traffic;
  manufacturer text = docs/registers/modbus.yaml (NUOS II 09/2026). The 2023 NUOS 400 manual has no register table.
findings:
- 'Register-space inference CONFIRMED: parameters are holding registers (FC03), datapoints are input registers (FC04). Holding
  8 = 12 is Start_HP_Hour, input 8 = T2 tank = 55.5 C.'
- 'Address convention CONFIRMED for datapoints: manual address = PDU address (offset 0): input 9 tracks the compressor (power
  meter), input 7/8 track the evaporator/tank thermal response.'
- Four historical failed updates (20 Oct 21:08, 21 Oct 04:55, 19:21, 19:41, each a 2 min gap) are past events; the current
  state is healthy. last_error=null does not mean no history.
- No label was proven wrong. T3 (input 19) = 0.0 constant is not behaving as a temperature (UNKNOWN). RTC date/year show 8/2/2000
  while time-of-day runs.
- 'Status word: 4 = compressor run, 2 = idle (observed); no bit table, so not decoded. Alarm word 0 throughout.'
pending_owner_display_reading:
  needed: optional, one reading
  items:
  - Software VTxx (service menu)
  - T Wasser (tank)
  - Timer on/off and Start HP hour
  - Betr.Art, T Soll, T max
  - Clock (time/date) if shown
  - Status line text
  note: Would upgrade T1/T2/mode/setpoints from PROVEN-behaviour/PLAUSIBLE to calibrated-validated.
